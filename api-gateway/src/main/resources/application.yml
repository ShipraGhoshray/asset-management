server:
  port: 8080   # Gateway runs on 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: asset-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/assets/**
        - id: pricing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/pricing/**